# Prod overlay: routes api / admin / miniapp through Traefik on the host's
# external `web` network. Traefik terminates TLS via its own ACME resolver.
#
# Usage on the server:
#   docker network create web        # once, if it doesn't exist
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required in .env:
#   PUBLIC_HOSTNAME=cashlibot.example.com
#   # optional; matches the resolver name configured in your Traefik static config.
#   TRAEFIK_CERT_RESOLVER=letsencrypt

name: cashlibot

x-traefik-common: &traefik-common
  traefik.enable: "true"
  traefik.docker.network: web

services:
  api:
    ports: !override []
    networks:
      - default
      - web
    labels:
      <<: *traefik-common
      # HTTPS router — TLS via the ACME resolver named in TRAEFIK_CERT_RESOLVER.
      traefik.http.routers.cashlibot-api.rule: "Host(`${PUBLIC_HOSTNAME}`) && PathPrefix(`/api`)"
      traefik.http.routers.cashlibot-api.entrypoints: websecure
      traefik.http.routers.cashlibot-api.tls: "true"
      traefik.http.routers.cashlibot-api.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.services.cashlibot-api.loadbalancer.server.port: "8000"
      # /health for uptime pings — same service, same TLS.
      traefik.http.routers.cashlibot-health.rule: "Host(`${PUBLIC_HOSTNAME}`) && Path(`/health`)"
      traefik.http.routers.cashlibot-health.entrypoints: websecure
      traefik.http.routers.cashlibot-health.tls: "true"
      traefik.http.routers.cashlibot-health.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.cashlibot-health.service: cashlibot-api

  admin:
    ports: !override []
    environment:
      VITE_BASE: /admin/
      VITE_API_BASE: ""
    networks:
      - default
      - web
    labels:
      <<: *traefik-common
      traefik.http.routers.cashlibot-admin.rule: "Host(`${PUBLIC_HOSTNAME}`) && PathPrefix(`/admin`)"
      traefik.http.routers.cashlibot-admin.entrypoints: websecure
      traefik.http.routers.cashlibot-admin.tls: "true"
      traefik.http.routers.cashlibot-admin.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.services.cashlibot-admin.loadbalancer.server.port: "5174"

  miniapp:
    ports: !override []
    environment:
      VITE_API_BASE: ""
    networks:
      - default
      - web
    labels:
      <<: *traefik-common
      # HTTPS catch-all — priority=1 so /api and /admin routers win.
      traefik.http.routers.cashlibot-miniapp.rule: "Host(`${PUBLIC_HOSTNAME}`)"
      traefik.http.routers.cashlibot-miniapp.entrypoints: websecure
      traefik.http.routers.cashlibot-miniapp.tls: "true"
      traefik.http.routers.cashlibot-miniapp.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.cashlibot-miniapp.priority: "1"
      traefik.http.services.cashlibot-miniapp.loadbalancer.server.port: "5173"
      # HTTP catch-all → 301 to HTTPS. One router covers /api, /admin and /
      # because all three live under the same host.
      traefik.http.middlewares.cashlibot-https.redirectscheme.scheme: https
      traefik.http.middlewares.cashlibot-https.redirectscheme.permanent: "true"
      traefik.http.routers.cashlibot-http.rule: "Host(`${PUBLIC_HOSTNAME}`)"
      traefik.http.routers.cashlibot-http.entrypoints: web
      traefik.http.routers.cashlibot-http.middlewares: cashlibot-https@docker

networks:
  web:
    external: true
