start:
  welcome_new: |
    سلام {name}. من Cashlibot هستم — کمکت می‌کنم پولات رو مدیریت کنی.

    اول از همه: دکمه‌ی پایین رو بزن و اپ رو باز کن تا تنظیمات اولیه رو انجام بدیم. یه دقیقه بیشتر طول نمی‌کشه.
  welcome_unfinished: |
    سلام {name}، دفعه‌ی قبل تنظیمات رو تموم نکردیم. اپ رو باز کن و ادامه بده.
  welcome_back: |
    سلام {name}، خوش اومدی. هرچی می‌خوای بگو — مثلا «۲۵ برای ناهار دادم» و خودم ثبت می‌کنم.
  miniapp_not_configured: |
    آدرس Mini App هنوز تنظیم نشده، نمی‌تونم صفحه‌ی راه‌اندازی رو باز کنم. به ادمین بگو MINIAPP_URL رو تنظیم کنه.

budget:
  notify:
    warning: |
      حواست باشه: تو این {period}، {percent}٪ از بودجه‌ی {category} رفت ({spent} از {limit} {currency}).
    exceeded: |
      از بودجه‌ی {category} تو این {period} رد شدی ({spent} از {limit} {currency}).

gamification:
  badge_earned: |
    نشان جدید — {name}. {description}
  level_up: |
    یه لِوِل بالا رفتی: {from_level} → {to_level}. الان {total_xp} امتیاز داری.

recurring:
  due_prompt: |
    {description} امروز موعدشه ({amount} {currency}). ثبتش کنیم؟
  button:
    confirm: "ثبت کن"
    skip: "بی‌خیال"
  answered:
    confirmed: "ثبت شد"
    skipped: "رد شد"
  followup:
    confirmed: "ثبت شد. دفعه‌ی بعد که موعدش برسه دوباره خبرت می‌کنم."
    skipped: "این‌بار رد شد. دفعه‌ی بعد که موعدش برسه دوباره خبرت می‌کنم."
  gone: "این پیام دیگه فعال نیست."
  already_resolved: "قبلاً به این جواب دادی."

credits:
  balance_and_pick: |
    {balance} اعتبار داری. یه پکیج انتخاب کن تا شارژ بشی:
  package_button: "{label} — {credits} اعتبار · {stars} ⭐️"
  invoice_title: "{credits} اعتبار Cashlibot"
  invoice_description: |
    {label} — {credits} اعتبار برای امکانات هوش مصنوعی.
  paid: |
    پرداخت انجام شد. +{credits} اعتبار. الان {balance} اعتبار داری.
  paid_duplicate: |
    این پرداخت قبلاً ثبت شده — تغییری تو موجودیت اعمال نشد.

