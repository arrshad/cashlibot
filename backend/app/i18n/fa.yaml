start:
  welcome: |
    👋 سلام {name}، به Cashlibot خوش آمدید!

    من دستیار مالی شخصی شما هستم. می‌توانید با من به‌سادگی فارسی (یا انگلیسی) صحبت کنید —
    کمک می‌کنم پول‌تان را در حساب‌های مختلف پیگیری کنید، بودجه تعیین کنید،
    برای اهداف خود پس‌انداز کنید، هزینه‌ها را با دوستان تقسیم کنید و خیلی کارهای دیگر.

    تجربه کامل هنوز ساخته نشده — این یک نسخه‌ی اولیه‌ی اسکفولد است.

