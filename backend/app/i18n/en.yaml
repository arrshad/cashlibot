start:
  welcome_new: |
    Hey {name}. I'm Cashlibot — your personal finance helper.

    First things first: tap the button below to open the app and get set up. It takes a minute.
  welcome_unfinished: |
    Hey {name}, we didn't finish setting things up last time. Open the app to pick up where we left off.
  welcome_back: |
    Hey {name}, welcome back. Just talk to me — try something like "paid 25 for lunch" and I'll log it.
