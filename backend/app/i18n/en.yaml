  not_onboarded: "Finish setup first — tap /start to open the app."
  no_credits: "You're out of credits. Use /credits to top up."
  ai_unavailable: "The AI isn't configured yet. Ask the admin to set the provider key."
  ai_error: "Something broke on my side. Try again in a moment."
  ai_empty: "I didn't catch that. Can you rephrase?"
  preview:
    confirm: "Log it"
    cancel: "Cancel"
    confirmed: "Logged."
    confirmed_short: "Logged"
    cancelled: "Cancelled."
    cancelled_short: "Cancelled"
    expired: "That preview expired. Send it again."
    failed: "Couldn't save that one."

