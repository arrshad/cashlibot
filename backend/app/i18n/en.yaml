start:
  welcome_new: |
    Hey {name}. I'm Cashlibot — your personal finance helper.

    First things first: tap the button below to open the app and get set up. It takes a minute.
  welcome_unfinished: |
    Hey {name}, we didn't finish setting things up last time. Open the app to pick up where we left off.
  welcome_back: |
    Hey {name}, welcome back. Just talk to me — try something like "paid 25 for lunch" and I'll log it.
  miniapp_not_configured: |
    The Mini App URL isn't set yet, so I can't open the setup screen for you. Ask the admin to set MINIAPP_URL in the bot config.

budget:
  notify:
    warning: |
      Heads up: {percent}% of your {category} budget is gone this {period} ({spent} / {limit} {currency}).
    exceeded: |
      You've gone past your {category} budget this {period} ({spent} / {limit} {currency}).

gamification:
  badge_earned: |
    New badge — {name}. {description}
  level_up: |
    Level up: {from_level} → {to_level}. You're at {total_xp} XP.

recurring:
  due_prompt: |
    {description} is due today ({amount} {currency}). Log it?
  button:
    confirm: "Log it"
    skip: "Skip"
  answered:
    confirmed: "Logged"
    skipped: "Skipped"
  followup:
    confirmed: "Logged. I'll ping you again next time it's due."
    skipped: "Skipped this one. I'll ping you again next time it's due."
  gone: "That prompt is gone."
  already_resolved: "You've already answered this one."

credits:
  balance_and_pick: |
    You have {balance} credits. Pick a package to top up:
  package_button: "{label} — {credits} credits · {stars} ⭐️"
  invoice_title: "{credits} Cashlibot credits"
  invoice_description: |
    {label} — {credits} credits for AI features.
  paid: |
    Payment received. +{credits} credits. You now have {balance}.
  paid_duplicate: |
    Payment already processed — no change to your balance.

friends:
  usage_addfriend: "Use it like /addfriend @username."
  error: "Couldn't do that — {reason}."
  request_sent: "Request sent to {name}. I'll let you know when they answer."
  incoming_request: |
    {name} (@{username}) wants to add you as a friend on Cashlibot.
  button:
    accept: "Accept"
    decline: "Decline"
  answered:
    accepted: "Accepted"
    declined: "Declined"
  followup:
    accepted: "You and {name} are friends now."
    declined: "Request from {name} declined."
  requester_accepted: |
    {name} accepted your friend request on Cashlibot.
  list_header: "Your friends ({count}):"
  list_incoming_header: "Pending — waiting on you:"
  list_outgoing_header: "Pending — waiting on them:"
  list_empty: "You don't have any friends on Cashlibot yet. Use /addfriend @username."
  gone: "That request is gone."

chat:
  not_registered: "Send /start first so I can register you."
  not_onboarded: "Finish setup first — tap /start to open the app."
  no_credits: "You're out of credits. Use /credits to top up."
  ai_unavailable: "The AI isn't configured yet. Ask the admin to set the provider key."
  ai_error: "Something broke on my side. Try again in a moment."
  ai_empty: "I didn't catch that. Can you rephrase?"
  preview:
    confirm: "Log it"
    cancel: "Cancel"
    confirmed: "Logged."
    confirmed_short: "Logged"
    cancelled: "Cancelled."
    cancelled_short: "Cancelled"
    expired: "That preview expired. Send it again."
    failed: "Couldn't save that one."

common:
  open_app: "Open the app"
  setup: "Set up"
  cancel: "Cancel"
  back: "Back"
  next: "Next"
  skip: "Skip"
  done: "Done"
